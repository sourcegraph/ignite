name: Release kernel images

on:
  workflow_dispatch:
    inputs:
      user:
        description: Container registry user.
        default: sourcegraph
        required: true

env:
  DOCKER_USER: ${{ github.event.inputs.user }}

defaults:
  run:
    working-directory: images/kernel

jobs:
  kernel:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Docker Hub OIDC login
    strategy:
      fail-fast: false
      matrix:
        version: [ 6.1.190 ]
    env:
      KERNEL_VERSIONS: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Login to container registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: docker.io
          username: sourcegraph
        env:
          DOCKERHUB_OIDC_CONNECTIONID: 9f14c248-6ae5-4c2a-ad0c-3af4ca55a16e
      - run: make
        env:
          GOARCH: amd64
          REGISTRY: ${{ env.DOCKER_USER }}
      # - run: make
      #   env:
      #     GOARCH: arm64
      - run: make push
        env:
          GOARCH: amd64
          REGISTRY: ${{ env.DOCKER_USER }}
