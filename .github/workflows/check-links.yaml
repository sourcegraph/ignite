name: docs

on:
  schedule:
    # Scheduled workflows run on the latest commit on the default or base branch. 
    # * is a special character in YAML so you have to quote this string
    - cron:  '0 0 * * 3'

jobs:
  markdown-link-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Check top-level markdown files
      - uses: gaurav-nelson/github-action-markdown-link-check@3c3b66f1f7d0900e37b71eca45b63ea9eedfce31 # 1.0.17
        with:
          max-depth: '0'
          use-verbose-mode: 'yes'
          config-file: 'markdown-link-check-config.json'

  site-link-checker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      - name: Build docs for link check
        run: mkdocs build

        # Using liche action to check generated HTML site
      - name: Link Checker (generated site)
        id: lc2
        uses: peter-evans/link-checker@41c97244bb50a4a1b273d60abf5b5862b09f0c2d # v1.2.2
        with:
          args: -d site/ -r site/ -x "(github.com/weaveworks/ignite($|/issue|/pull|/releases|/commit/|/releases)|squidfunk.github.io|ignite.readthedocs.io)"

      - name: Fail if there were link errors
        run: exit ${{ steps.lc2.outputs.exit_code }}
